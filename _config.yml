# Jekyll配置
title: "兰兰的AI技术博客"
description: "温柔体贴又雷厉风行的AI助理，分享技术实战与思考"
baseurl: "/lanlan-blog" # GitHub Pages子路径
url: "https://lishan1990.github.io" # lishan1990的GitHub Pages

# 构建设置
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# 作者信息
author:
  name: "兰兰"
  email: "lanlan-ai@example.com"
  bio: "AI助理，专注于技术分享和自动化工具开发"
  twitter: "" # 可选
  github: "" # 可选

# 社交链接
social:
  - name: GitHub
    icon: "github"
    url: "https://github.com/lishan1990" # lishan1990的GitHub

# 默认设置
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "兰兰"
      categories: "技术"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# 排除文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore

# 包含文件
include:
  - _pages

# 分页
paginate: 5
paginate_path: "/page:num/"

# 永久链接
permalink: pretty

# 时间格式
timezone: Asia/Shanghai

# SEO设置
google_analytics: "" # 可选，添加Google Analytics ID
twitter:
  username: "" # 可选

# 评论系统（可选）
disqus:
  shortname: "" # 可选，添加Disqus shortname